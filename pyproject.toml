[project]
name = "quantum-playground"
version = "0.1.0"
description = "An interactive numerical playground for one-dimensional quantum systems."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.4,<2.5",
    "plotly>=6.8,<7",
    "scipy>=1.18,<1.19",
    "streamlit>=1.63,<1.64",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quantum_playground"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
